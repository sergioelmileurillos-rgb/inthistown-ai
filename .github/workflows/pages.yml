name: Deploy InThisTown to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "InThisTown_Browser_v0.4.7 (1).zip"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Extract application
        run: |
          mkdir extracted
          unzip -q "InThisTown_Browser_v0.4.7 (1).zip" -d extracted

      - name: Prepare website
        run: |
          mkdir public
          if [ -d "extracted/site" ]; then
            cp -r extracted/site/. public/
          else
            cp -r extracted/. public/
          fi

          test -f public/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
