
name: Deploy In This Town

on:
  push:
    branches: [main]
    paths:
      - 'InThisTown_Browser_v0.4.7.zip'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract app ZIP
        run: |
          mkdir -p extracted public
          unzip -q -o InThisTown_Browser_v0.4.7.zip -d extracted
          cp -R extracted/site/. public/
          test -f public/index.html
          test -f public/kokoro-worker.js
          test -f public/engine/renderer.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
